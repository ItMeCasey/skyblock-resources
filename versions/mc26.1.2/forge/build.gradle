plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '2026.11.1'
group = 'com.itmecasey.skyblockresources'

// Jar name: skyblock_resources-forge-<minecraft version>-<mod version>
base {
    archivesName = 'skyblock_resources-forge-26.1.2'
}

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Data and assets come from the shared common/ folder; see docs/PORTING_LAYOUT.md.
// Forge 26.1.2 reads one "forge:condition" object (type "forge:mod_loaded") instead of an array; the script converts them.
ext.dataTarget = [mc: '26.1.2', format: 'v26', loader: 'forge', conditionsKey: 'forge:condition', modLoadedType: 'forge:mod_loaded', conditionsMode: 'single']
apply from: '../../../tools/common-data.gradle'

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTest') {
            // The headless self-test (see HeadlessSelfTest): a server that checks drops and upgrades, prints SELFTEST
            // PASSED or SELFTEST FAILED and stops. This is Forge's game test server, which starts a real server
            // without the EULA check. Its port argument is ignored; the dedicated variant below uses it.
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--gameDir', '.', '--launchTarget', 'forge_userdev_server_gametest', '--port', '8901'
            jvmArgs '-Djava.net.preferIPv6Addresses=system'
            systemProperty 'skyblock.selftest', 'true'
        }

        register('gameTestDedicated') {
            // The same self-test on a dedicated server, as the NeoForge project runs it. Needs run/eula.txt to say
            // eula=true (the first start writes it with eula=false; accepting the Minecraft EULA is up to you).
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--gameDir', '.', '--launchTarget', 'forge_userdev_server', '--nogui'
            jvmArgs '-Djava.net.preferIPv6Addresses=system'
            systemProperty 'skyblock.selftest', 'true'
            // Own port so builds for other versions can run their tests at the same time.
            args '--port', '8901'
        }
    }
}

// The game test server exits with a non-zero status after halting; the result is the SELFTEST line in the log.
tasks.matching { it.name == 'runGameTest' }.configureEach { it.ignoreExitValue = true }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        url 'https://cursemaven.com'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.1.2-64.1.6')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'

    // SMWTI is not published yet, so use the jar from its own project build.
    implementation files("${System.getProperty('user.home')}/Desktop/SMWTI/versions/mc26.1.2/forge/build/libs/smwti-forge-26.1.2-2026.11.1.jar")

    // Dev-environment test mods that have a Forge 26.1.2 build (versions are Modrinth version ids). Croptopia, Mystical
    // Agriculture, Cucumber, Jade, KubeJS, JEI and the other mods the NeoForge build loads have no Forge 26.1.2 build.
    runtimeOnly 'maven.modrinth:biomes-o-plenty:QbPWS83T'
    runtimeOnly 'maven.modrinth:glitchcore:uyFrxu03'
    runtimeOnly 'maven.modrinth:terrablender:QtQ34tp7'
    runtimeOnly 'maven.modrinth:oh-the-trees-youll-grow:7jXqyAsW'
    runtimeOnly 'maven.modrinth:mouse-tweaks:aVJiOMeh'
}
