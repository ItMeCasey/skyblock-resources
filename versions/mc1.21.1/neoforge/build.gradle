plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '2026.11.5'
base.archivesName = 'skyblock_resources-neoforge-1.21.1'

// Mojang ships Java 21 to end users in 1.20.5+, so the mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Data and assets come from the shared common/ folder; see docs/PORTING_LAYOUT.md.
ext.dataTarget = [mc: '1.21.1', format: 'v21', loader: 'neoforge']
apply from: '../../../tools/common-data.gradle'

neoForge {
    version = '21.1.265'

    runs {
        client {
            client()
        }
        server {
            server()
        }
        gameTest {
            server()
            systemProperty 'skyblock.selftest', 'true'
            // Own port so builds for other versions can run their tests at the same time.
            programArguments.addAll('--port', '8902')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        skyblock_resources {
            sourceSet sourceSets.main
        }
    }
}

if (project.hasProperty('viewerCheck')) {
    sourceSets.main.java.srcDir 'src/devtest/java'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

repositories {
    def imcUser = System.getenv('IMC_MAVEN_USER') ?: project.findProperty('imcMavenUser')
    def imcPass = System.getenv('IMC_MAVEN_PASSWORD') ?: project.findProperty('imcMavenPassword')
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey mirror'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
            content { includeGroup 'curse.maven' }
        }
    }
    maven {
        url 'https://cursemaven.com'
    }
    maven {
        name = "Progwml6's maven"
        url = 'https://dvs1.progwml6.com/files/maven/'
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // SMWTI is on the private Maven (a mirror of its CurseForge file).
    compileOnly 'curse.maven:smwti-1781438:9423203'
    // -PjadeCheck leaves SMWTI out of the dev client and puts Jade in, so an overlay check shows one overlay mod.
    if (!project.hasProperty('jadeCheck')) runtimeOnly 'curse.maven:smwti-1781438:9423203'
    // BEI (Barely Enough Items), a recipe viewer of ours. Only its API is compiled against, from the jar in libs.
    compileOnly files('libs/bei-neoforge-1.21.1-2026.11.4-api.jar')
    // REI and EMI, the other recipe viewers: compiled against only, never required. REI needs Cloth Config and Architectury at run time.
    compileOnly 'maven.modrinth:rei:b8gfS9Je'
    compileOnly 'maven.modrinth:cloth-config:izKINKFg'
    compileOnly 'maven.modrinth:architectury-api:1IiqEQGl'
    compileOnly 'maven.modrinth:emi:5sIPA1To'
    compileOnly 'curse.maven:jade-324717:8591319'
    if (project.hasProperty('jadeCheck')) runtimeOnly 'curse.maven:jade-324717:8591319'

    compileOnly 'maven.modrinth:kubejs:GDXCpKlp'
    compileOnly 'maven.modrinth:rhino:SqkDvOLG'
    runtimeOnly 'maven.modrinth:kubejs:GDXCpKlp'
    runtimeOnly 'maven.modrinth:rhino:SqkDvOLG'
    runtimeOnly 'maven.modrinth:better-advanced-tooltips:uPFbnD32'

    // Test mods for the dev environment and the headless self-test (versions are Modrinth version ids; Croptopia is CurseForge only).
    runtimeOnly 'curse.maven:croptopia-415438:7958876'
    runtimeOnly 'curse.maven:epherolib-885449:5872111'
    runtimeOnly 'maven.modrinth:cucumber:8421rqFF'
    runtimeOnly 'maven.modrinth:mystical-agriculture:4Wc9oVPI'
    runtimeOnly 'maven.modrinth:biomes-o-plenty:BtZKRp69'
    runtimeOnly 'maven.modrinth:glitchcore:S2TfWrZR'
    runtimeOnly 'maven.modrinth:terrablender:6e8GCrLb'

    // Mods the bundled plant and block recipes cover, so they can be loaded and checked.
    runtimeOnly 'maven.modrinth:terralith:IY93YaEe'
    runtimeOnly 'maven.modrinth:lithostitched:cZu4cHY3'
    runtimeOnly 'maven.modrinth:oh-the-trees-youll-grow:ZTJAJGUE'
    runtimeOnly 'maven.modrinth:ecologics:SJySxVHt'
    runtimeOnly 'maven.modrinth:natures-spirit:EQReaqUo'
    runtimeOnly 'maven.modrinth:occultism:G2KAfQNU'
    runtimeOnly 'maven.modrinth:modonomicon:OKyLanIn'
    runtimeOnly 'maven.modrinth:curios:yohfFbgD'
    runtimeOnly 'maven.modrinth:geckolib:Grwn5rUB'
    runtimeOnly 'maven.modrinth:smartbrainlib:O5EpeqI3'
    runtimeOnly 'maven.modrinth:evilcraft:mOGfae8K'
    runtimeOnly 'maven.modrinth:cyclops-core:axSK9vET'
    runtimeOnly 'maven.modrinth:integrated-dynamics:Y6B7nflS'
    runtimeOnly 'maven.modrinth:common-capabilities:R9PufPlP'
    runtimeOnly 'maven.modrinth:refined-storage:lHHiI26k'
    runtimeOnly 'maven.modrinth:mystical-agradditions:fNQephU4'
    runtimeOnly 'maven.modrinth:forbidden-arcanus:fNjxgZPH'
    runtimeOnly 'maven.modrinth:valhelsia-core:cttRekq9'

    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.64.0.455'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.64.0.455'
    // -PviewerCheck leaves JEI out of the dev client and compiles the dev-only tour in src/devtest, so a recipe viewer
    // check shows this mod with one viewer. -PbeiJar=<path> adds a local BEI jar to the dev client.
    if (!project.hasProperty('viewerCheck') || project.findProperty('viewer') == 'jei') runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.64.0.455'
    // -Pviewer=rei or -Pviewer=emi puts that viewer into the dev client for the viewer check.
    if (project.findProperty('viewer') == 'rei') {
        runtimeOnly 'maven.modrinth:rei:b8gfS9Je'
        runtimeOnly 'maven.modrinth:cloth-config:izKINKFg'
        runtimeOnly 'maven.modrinth:architectury-api:1IiqEQGl'
    }
    if (project.findProperty('viewer') == 'emi') runtimeOnly 'maven.modrinth:emi:5sIPA1To'
    if (project.hasProperty('beiJar')) runtimeOnly files(project.property('beiJar'))
    // -PmodjsJar=<path> adds a local ModJS jar to the dev runs, to try the scripting bridge for real.
    if (project.hasProperty('modjsJar')) runtimeOnly files(project.property('modjsJar'))
}
