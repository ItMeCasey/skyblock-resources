name: build

# Builds all ten Skyblock Resources jars and runs each headless self test on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        run: python3 .github/scripts/plan_matrix.py build --before "${{ github.event.before }}" --sha "${{ github.sha }}"
  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      IMC_MAVEN_USER: ${{ secrets.IMC_MAVEN_USER }}
      IMC_MAVEN_PASSWORD: ${{ secrets.IMC_MAVEN_PASSWORD }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - name: Headless self test
        run: |
          # The test server stops at the EULA prompt on a clean runner; accept it for the test server only.
          mkdir -p run run-gametest
          echo 'eula=true' | tee run/eula.txt run-gametest/eula.txt > /dev/null
          timeout 900 ./gradlew runGameTest --no-daemon 2>&1 | tee selftest.log
          grep -q "SELFTEST PASSED" selftest.log
          ! grep -q "SELFTEST FAILED" selftest.log
      - uses: actions/upload-artifact@v5
        with:
          name: jar-${{ matrix.module }}
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: error
