name: release

# Push a tag such as v2026.11.1 to build all six jars, publish a GitHub release and upload them to CurseForge.
# The tag must match the version in every module's build.gradle.
# Needs the repository secret CURSEFORGE_TOKEN (a CurseForge upload API token).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release type
        type: choice
        options: [beta, alpha, release]
        default: beta
      publish:
        description: Upload to CurseForge (off builds and attaches the jars to the run only)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-26.1.2
            dir: versions/mc26.1.2/forge
            java: 25
          - module: neoforge-26.1.2
            dir: versions/mc26.1.2/neoforge
            java: 25
          - module: forge-1.21.1
            dir: versions/mc1.21.1/forge
            java: 21
          - module: neoforge-1.21.1
            dir: versions/mc1.21.1/neoforge
            java: 21
          - module: forge-1.20.1
            dir: versions/mc1.20.1/forge
            java: 17
          - module: neoforge-1.20.1
            dir: versions/mc1.20.1/neoforge
            java: 17
    runs-on: ubuntu-latest
    env:
      IMC_MAVEN_USER: ${{ secrets.IMC_MAVEN_USER }}
      IMC_MAVEN_PASSWORD: ${{ secrets.IMC_MAVEN_PASSWORD }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - name: Headless self test
        run: |
          # The test server stops at the EULA prompt on a clean runner; accept it for the test server only.
          mkdir -p run run-gametest
          echo 'eula=true' | tee run/eula.txt run-gametest/eula.txt > /dev/null
          timeout 900 ./gradlew runGameTest --no-daemon 2>&1 | tee selftest.log
          grep -q "SELFTEST PASSED" selftest.log
          ! grep -q "SELFTEST FAILED" selftest.log
      - uses: actions/upload-artifact@v5
        with:
          name: jar-${{ matrix.module }}
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: jar-*

      - name: Check the version
        id: version
        run: |
          versions=$(grep -h "^version = '" versions/*/*/build.gradle | sed "s/^version = '\(.*\)'/\1/" | sort -u)
          if [ "$(echo "$versions" | wc -l)" != "1" ]; then echo "Modules disagree on the version:"; echo "$versions"; exit 1; fi
          version="$versions"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1
          fi

      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          {
            echo "Builds for Minecraft 26.1.2, 1.21.1 and 1.20.1 on Forge and NeoForge."
            echo
            echo "Guide: https://itmecasey.com/wiki/skyblock-resources/"
            echo
            echo "Changes:"
            if [ -n "$previous" ]; then git log --no-merges --pretty='format:- %s' "$previous..${GITHUB_SHA}"; else git log --no-merges -n 20 --pretty='format:- %s'; fi
            echo
          } > notes.md
          cat notes.md

      - name: Collect the jars
        run: python3 .github/scripts/publish_curseforge.py --artifacts artifacts --version "${{ steps.version.outputs.version }}" --collect dist

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.jar             --title "Skyblock Resources ${{ steps.version.outputs.version }}"             --notes-file notes.md             --prerelease

      - name: Upload to CurseForge
        if: github.ref_type == 'tag' || inputs.publish
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py             --artifacts artifacts             --version "${{ steps.version.outputs.version }}"             --changelog-file notes.md             --release-type "${{ inputs.release_type || 'beta' }}"

      - name: Keep the jars with the run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-jars
          path: dist/*.jar
