name: Feature request
description: Suggest a new generator, plant, recipe, or other change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to see. A mod id and version helps for plants or recipes from other mods.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: minecraft-versions
    attributes:
      label: Minecraft versions it should cover
      multiple: true
      options:
        - "26.1.2"
        - "1.21.1"
        - "1.20.1"
        - Not sure
